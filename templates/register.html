<!DOCTYPE html>
<html>
<head>
    <title>Network IDS - Register</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .box {
            background: #1f2937;
            padding: 30px;
            width: 380px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,.4);
        }
        h2 { text-align: center; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 5px;
            border: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover { background: #1d4ed8; }
        .flash { padding: 8px 12px; border-radius: 5px; margin: 6px 0; font-size: 14px; }
        .flash-danger { background: #7f1d1d; color: #fca5a5; }
        .flash-success { background: #064e3b; color: #6ee7b7; }
        .back { text-align: center; margin-top: 15px; }
        a { color: #60a5fa; }
    </style>
</head>
<body>
<div class="box">
    <h2>Create Account</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" placeholder="Username (min 3 chars)" required minlength="3">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@example.com" required>
        <label>Password</label>
        <input type="password" name="password" placeholder="Password (min 6 chars)" required minlength="6">
        <button type="submit">Register</button>
    </form>

    <div class="back">
        <a href="{{ url_for('login') }}">Already have an account? Sign in</a>
    </div>
</div>
</body>
</html>
