{% extends "base.html" %}
{% block title %}Create User - Network IDS{% endblock %}
{% block content %}
<h2>Create User</h2>

<div class="panel" style="max-width:420px">
    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" value="{{ form_data.username or '' }}" required minlength="3">
        <label>Email</label>
        <input type="email" name="email" value="{{ form_data.email or '' }}" required>
        <label>Password</label>
        <input type="password" name="password" required minlength="6">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" required minlength="6">
        <label>
            <input type="checkbox" name="is_active" style="width:auto" checked> Active
        </label>
        <button type="submit" style="margin-top:10px">Create User</button>
    </form>
</div>

<a class="btn btn-secondary" href="{{ url_for('admin_users') }}">⬅ Back to Users</a>
{% endblock %}
